# Baut die App und fährt die Selbsttests bei jedem Push auf main und bei Pull Requests.
# macos-26 wie in icon.yml (Xcode 26 mit SwiftUI-Macros); build.sh nimmt dort das SDK aus xcrun,
# weil es die CommandLineTools-SDKs nur lokal gibt. Kein Signieren, kein Notarisieren: ./build.sh
# signiert ad hoc, der Ed25519-Release-Schlüssel wird nur in ./build.sh release gebraucht.
name: Build
on:
  push:
    branches: [ main ]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Neuestes Xcode wählen
        run: |
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          swiftc --version
      - name: Bauen
        run: ./build.sh
      - name: Selbsttests
        run: ./build.sh test
